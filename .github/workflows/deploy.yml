name: Deploy Website
on:
  push:
    branches: [main]
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to Hostinger via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          script_stop: true
          script: |
            set -e
            DEPLOY_PATH="${{ secrets.DEPLOY_PATH }}"
            REPO="https://${{ secrets.GITHUB_TOKEN }}@github.com/Dar-Afaq-Real-Estate-Company/Afaq-Website.git"

            if [! -d "$DEPLOY_PATH/.git" ]; then
              mkdir -p "$DEPLOY_PATH"
              git clone "$REPO" "$DEPLOY_PATH"
            fi

            cd "$DEPLOY_PATH"
            git remote set-url origin "$REPO"
            git fetch origin main
            git reset --hard origin/main

            # حافظ على ملفات السيرفر المهمة
            if [ -f.env.example ] && [! -f.env ]; then cp.env.example.env; fi

            mkdir -p storage/framework/views storage/framework/cache/data storage/framework/sessions storage/logs bootstrap/cache
            chmod -R 775 storage bootstrap/cache

            # ابنِ الـ frontend
            if [ -f package.json ]; then
              npm ci
              npm run build
            fi

            # نزل الـ backend
            /opt/alt/php83/usr/bin/php /usr/local/bin/composer install --no-dev --optimize-autoloader --no-interaction

            php artisan storage:link || true
            php artisan optimize:clear
            php artisan config:cache
            php artisan route:cache
            php artisan view:cache

            echo "Deployed: $(git rev-parse --short HEAD)"
