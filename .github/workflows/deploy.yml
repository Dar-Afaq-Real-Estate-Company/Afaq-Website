name: Deploy Website
on:
  push:
    branches: [main]
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to Hostinger via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT }}
          script_stop: true
          script: |
            set -e
            cd "${{ secrets.DEPLOY_PATH }}"
            REPO="https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/Dar-Afaq-Real-Estate-Company/Afaq-Website.git"
            if [ ! -d .git ]; then
              git init
            fi
            git fetch "$REPO" main
            git reset --hard FETCH_HEAD
            /opt/alt/php82/usr/bin/php /usr/local/bin/composer install --no-dev --optimize-autoloader --no-interaction
                mkdir -p storage/framework/views storage/framework/cache/data storage/framework/sessions storage/logs bootstrap/cache
            chmod -R 775 storage bootstrap/cache
/opt/alt/php82/usr/bin/php artisan optimize:clear
            echo "Deployed: $(git rev-parse --short HEAD)"