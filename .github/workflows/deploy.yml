name: Deploy Website to Main Domain
on:
  push:
    branches: [main]
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Deploy to afaq.group
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT }}
          script: |
            cd ${{ secrets.DEPLOY_PATH }}
            if [! -d.git ]; then
              git init
              git remote add origin https://github.com/Dar-Afaq-Real-Estate-Company/Afaq-Website.git || true
              git fetch origin main
              git reset --hard origin/main
            else
              git fetch origin main
              git reset --hard origin/main
            fi
            /opt/alt/php82/usr/bin/php /usr/local/bin/composer install --no-dev --optimize-autoloader --no-interaction || true
            /opt/alt/php82/usr/bin/php artisan migrate --force || true
            /opt/alt/php82/usr/bin/php artisan optimize:clear || true
            /opt/alt/php82/usr/bin/php artisan config:cache || true
