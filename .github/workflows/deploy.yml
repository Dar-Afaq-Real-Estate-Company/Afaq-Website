name: Deploy Website
on:
  push:
    branches: [main]
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Deploy to Hostinger
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT }}
          script: |
            cd ${{ secrets.DEPLOY_PATH }}
            rm -f default.php index.html
            if [! -d.git ]; then
              git clone https://github.com/Dar-Afaq-Real-Estate-Company/Afaq-Website.git.
            else
              git fetch origin main
              git reset --hard origin/main
            fi
            /opt/alt/php82/usr/bin/php /usr/local/bin/composer install --no-dev --optimize-autoloader --no-interaction || true
            cp.env.example.env || true
            /opt/alt/php82/usr/bin/php artisan key:generate --force || true
            /opt/alt/php82/usr/bin/php artisan migrate --force || true
            /opt/alt/php82/usr/bin/php artisan config:clear || true
            /opt/alt/php82/usr/bin/php artisan route:clear || true
            /opt/alt/php82/usr/bin/php artisan view:clear || true
            /opt/alt/php82/usr/bin/php artisan config:cache || true
            /opt/alt/php82/usr/bin/php artisan storage:link || true
